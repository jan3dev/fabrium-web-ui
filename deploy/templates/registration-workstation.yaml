# Rendered by deploy/add-workstation.sh into
# ${ZOOID_HOME}/data/matrix/config/registrations/<workstation>.yaml (mode 600).
# One agent VM: a zooid workstation in client (pull) mode. Same shape as the
# registration zooid writes for a workstation (packages/cli/src/bootstrap/configs.ts).
# Placeholders: WORKSTATION, WS_AS_TOKEN, WS_HS_TOKEN, SERVER_NAME_RE.
id: ${WORKSTATION}
# Pull mode: the VM reads with /sync, so tuwunel has nothing to push.
url: null
as_token: ${WS_AS_TOKEN}
hs_token: ${WS_HS_TOKEN}
sender_localpart: ${WORKSTATION}
rate_limited: false
namespaces:
  users:
    - exclusive: true
      regex: '@${WORKSTATION}\..*:${SERVER_NAME_RE}'
  aliases:
    - exclusive: false
      regex: '#.*:${SERVER_NAME_RE}'
  rooms: []
