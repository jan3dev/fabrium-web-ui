<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070708" />
    <!-- Applies the saved theme before first paint. Mirrors components/theme-provider.tsx. -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem("fabrium:theme:v1");
          var d = p === "light" ? false : p === "system" ? matchMedia("(prefers-color-scheme: dark)").matches : true;
          var t = d ? "dark" : "light";
          var e = document.documentElement;
          e.setAttribute("data-theme", t);
          e.style.colorScheme = t;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", d ? "#070708" : "#f5f5f8");
        } catch (_) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Fabrium</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
